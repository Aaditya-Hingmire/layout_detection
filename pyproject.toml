[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answer-sheet-layout"
version = "0.2.0"
description = "Standalone PDF rendering and image-preparation foundation for answer-sheet layout detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]
yolo = ["ultralytics>=8.3"]

[project.scripts]
answer-sheet-layout = "answer_sheet_layout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_sheet_layout"]
